name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp-bridge
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: whatsapp-bridge/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Test without CGO
        env:
          CGO_ENABLED: '0'
        run: go test ./...
      - name: Run race detector
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...
      - name: Measure bounded synthetic archive import
        env:
          CGO_ENABLED: '0'
        run: |
          go test -c -o /tmp/archive.test ./internal/archive
          /usr/bin/time -v /tmp/archive.test -test.run '^$' -test.bench '^BenchmarkBoundedImport$' -test.benchtime=1x
      - name: Vet
        env:
          CGO_ENABLED: '0'
        run: go vet ./...
      - name: Measure streaming attachment cache
        env:
          CGO_ENABLED: '0'
        run: |
          go test -c -o /tmp/collector.test ./internal/collector
          /usr/bin/time -v /tmp/collector.test -test.run '^$' -test.bench '^BenchmarkStreamingAttachment$' -test.benchtime=1x

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            filename: whatsapp-bridge-linux-amd64
          - goos: linux
            goarch: arm64
            filename: whatsapp-bridge-linux-arm64
          - goos: windows
            goarch: amd64
            filename: whatsapp-bridge-windows-amd64.exe
    defaults:
      run:
        working-directory: whatsapp-bridge
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: whatsapp-bridge/go.sum
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o ../dist/${{ matrix.filename }} .
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.filename }}
          path: dist/${{ matrix.filename }}
          if-no-files-found: error
          retention-days: 7
